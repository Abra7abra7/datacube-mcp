# DATAcube production stack — Coolify-native
# Usage: docker compose -f docker-compose.yml up -d
#   DATACUBE_ADMIN_KEY=mysecret docker compose up -d
# NO explicit ports — Coolify proxy handles routing

services:
  datacube-api:
    build: .
    image: datacube-mcp:latest
    container_name: datacube-api
    environment:
      - DATACUBE_ADMIN_KEY=${DATACUBE_ADMIN_KEY:-}
      - DATACUBE_CORS_ORIGINS=${DATACUBE_CORS_ORIGINS:-https://datacube.marianstancik.dev}
      - DATACUBE_RATE_LIMIT=${DATACUBE_RATE_LIMIT:-100/minute}
      - DATACUBE_HOST=0.0.0.0
      - DATACUBE_PORT=8000
      - DATACUBE_DB_PATH=/data/datacube.db
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - datacube-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  datacube-data: