# DATAcube production stack
# Usage: docker compose up -d
#   DATACUBE_ADMIN_KEY=mysecret docker compose up -d

services:
  datacube-api:
    build: .
    image: datacube-mcp:latest
    container_name: datacube-api
    environment:
      # Coolify maps ports via internal proxy — no host port needed
      - DATACUBE_ADMIN_KEY=dc_admin_6b9e2ae10b062fc6aeb3735f9e2857c6
      - DATACUBE_CORS_ORIGINS=https://datacube.marianstancik.dev
      - DATACUBE_RATE_LIMIT=100/minute
      - DATACUBE_HOST=0.0.0.0
      - DATACUBE_PORT=8000
      - DATACUBE_DB_PATH=/data/datacube.db
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - datacube-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  datacube-data: